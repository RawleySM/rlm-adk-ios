# Builds, tests and runs the app on a GitHub-hosted Mac. No Apple Developer team or signing is needed
# for the iOS Simulator; signed device builds use the separate testflight.yml workflow.
# The screenshot step runs the Python backend on the runner in FIXTURE mode (synthetic data, fake
# reasoning owner) and a fixture talk server (scripts/ci_fake_talk.py: the talk tier's tagged-PCM
# WebSocket protocol with a scripted bot turn) so the simulator shows real connected/devotional/turn
# states and the app's wire protocol is checked. It is not real-data or real-voice evidence.
name: cloud-mac

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Backend unit tests (stdlib only)
        run: |
          cd backend
          python3 --version
          python3 -c 'import sqlite3; print("sqlite", sqlite3.sqlite_version)'
          set -o pipefail
          python3 -m unittest discover -s tests -t . -v 2>&1 | tee ../backend-tests.log | { grep -E "^(Ran|OK|FAILED|ERROR|FAIL)" || true; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-log
          path: backend-tests.log

  simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Cloud Mac environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          # The keyboard UI tests require the SOFTWARE keyboard; a connected hardware keyboard would
          # hide it. Set before the simulator boots so Simulator.app reads it on launch.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          defaults read com.apple.iphonesimulator ConnectHardwareKeyboard
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in devices if ".iOS-" in r), reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone") and device.get("isAvailable"):
                      print(device["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator found")')
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for iOS Simulator (unsigned)
        run: |
          # pipefail keeps xcodebuild's exit status; the grep is wrapped so "no matches" and SIGPIPE
          # cannot turn a failure into success or a success into failure. Full log is uploaded.
          set -o pipefail
          xcodebuild -project RLMADK.xcodeproj -scheme RLMADK -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-build.log | { grep -E "error:|\*\* BUILD" || true; }

      - name: Native state/outbox/source/inspection tests (XCTest) and keyboard navigation (XCUITest)
        run: |
          set -o pipefail
          xcodebuild -project RLMADK.xcodeproj -scheme RLMADK -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee xcodebuild-test.log | { grep -E "Test Case|Test Suite|Executed|error:|\*\* TEST" || true; }

      - name: Start fixture backend and fake reasoning owner on the runner
        run: |
          cd backend
          export VOICE_PORTAL_STATE="$RUNNER_TEMP/voice_portal_state"
          mkdir -p "$VOICE_PORTAL_STATE"
          python3 -m tests.fakes --port 8799 > "$RUNNER_TEMP/fake-owner.log" 2>&1 &
          cat > "$VOICE_PORTAL_STATE/config.json" <<JSON
          {"listen_host":"127.0.0.1","listen_port":8765,"inference_base_url":"http://127.0.0.1:8799/v1","inference_status_url":"http://127.0.0.1:8799/status","allocatorctl":"/nonexistent/allocatorctl","prayer_intake_url":"http://127.0.0.1:1","devotional_passages":["PSA.23"]}
          JSON
          python3 -m voice_portal fixture
          ./run-backend start
          cd ..
          python3 scripts/ci_fake_talk.py --port 7860 > "$RUNNER_TEMP/fake-talk.log" 2>&1 &
          cd backend
          sleep 2
          curl -s -X POST http://127.0.0.1:7860/start -H 'Content-Type: application/json' -d '{"transport":"websocket"}'; echo
          curl -s http://127.0.0.1:8765/status | python3 -m json.tool | head -40
          curl -s "http://127.0.0.1:8765/devotional?passage=PSA.23" | head -c 600; echo

      - name: Run in a simulator and take screenshots (fixture backend)
        run: |
          export VOICE_PORTAL_STATE="$RUNNER_TEMP/voice_portal_state"
          UDID="${{ steps.sim.outputs.udid }}"
          # Fresh device state after the XCTest host ran the same bundle: no lingering system alerts.
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'RLMADK.app' | head -1)
          xcrun simctl install "$UDID" "$APP"
          # Seed one retained capture file in the app container so the remote copy transfers real
          # bytes through the real client (the fixture app records nothing). Also an orphan directory
          # that no manifest lists, so the manifest sync shows it.
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.rawleystanhope.rlmadk data)
          python3 scripts/ci_seed_capture.py "$CONTAINER/Documents" ambient-ci-seed
          ls -la "$CONTAINER/Documents" "$CONTAINER/Documents/captures/ambient-ci-seed"
          # Fixture mode: the app requests neither speech recognition nor the microphone and does not
          # start the audio owner, so no permission dialog covers the screenshots. Not live-voice evidence.
          SIMCTL_CHILD_RLMADK_BACKEND_URL=http://127.0.0.1:8765 SIMCTL_CHILD_RLMADK_TALK_URL=http://127.0.0.1:7860 SIMCTL_CHILD_RLMADK_CI_DEMO=1 SIMCTL_CHILD_RLMADK_SKIP_PERMISSION_PROMPTS=1 \
            xcrun simctl launch "$UDID" com.rawleystanhope.rlmadk
          sleep 12
          xcrun simctl io "$UDID" screenshot simulator.png
          sleep 4
          # The CI demo opened Psalm 23 in the scripture pane and pressed Read: mid-reading shading.
          xcrun simctl io "$UDID" screenshot simulator-reading.png
          sleep 4
          xcrun simctl io "$UDID" screenshot simulator-after-turn.png
          # The app's talk protocol as the fixture talk server saw it: floor sync and typed text as
          # JSON, the uplink as 641-byte tagged frames (silence keepalive here: fixture mode starts
          # no capture), and the scripted bot turn delivered.
          curl -s http://127.0.0.1:7860/log > fake-talk-log.json
          python3 - <<'PY'
          import json
          log = json.load(open("fake-talk-log.json"))
          messages = [t["message"] for t in log["text"]]
          span = (log["last_binary_t"] or 0) - (log["first_binary_t"] or 0)
          rate = log["binary_frames"] / span if span > 0 else 0
          print(json.dumps({"starts": len(log["starts"]), "connections": log["connections"], "messages": messages, "binary_frames": log["binary_frames"], "binary_sizes": log["binary_sizes"], "frames_per_s": round(rate, 1), "bot_turns": log["bot_turns"]}, indent=1))
          problems = []
          if not any(m.get("type") == "client_mode" and m.get("mode") == "available" for m in messages): problems.append("no client_mode sync on connect")
          if not any(m.get("type") == "client_text" for m in messages): problems.append("typed demo not sent as client_text")
          if log["binary_frames"] < 100 or set(log["binary_sizes"]) != {"641"} or log["bad_tags"]: problems.append("uplink frames are not 0x01 + 640 bytes")
          if not 35 <= rate <= 65: problems.append(f"uplink not near 50 frames/s: {rate:.1f}")
          if log["bot_turns"] < 1: problems.append("scripted bot turn not played")
          if not any(m.get("type") == "client_passage" for m in messages): problems.append("scripture pane did not send client_passage")
          if not any(m.get("type") == "client_read" and m.get("action") == "play" for m in messages): problems.append("scripture pane did not send client_read play")
          if problems: raise SystemExit("TALK PROTOCOL PROBLEMS: " + "; ".join(problems))
          print("talk protocol exercised against the fixture talk server")
          PY
          # The scripture pane's navigator and read mode, each from a fresh launch.
          for view in NAVIGATOR READ_MODE; do
            xcrun simctl terminate "$UDID" com.rawleystanhope.rlmadk || true
            env "SIMCTL_CHILD_RLMADK_CI_$view=1" SIMCTL_CHILD_RLMADK_BACKEND_URL=http://127.0.0.1:8765 SIMCTL_CHILD_RLMADK_TALK_URL=http://127.0.0.1:7860 SIMCTL_CHILD_RLMADK_SKIP_PERMISSION_PROMPTS=1 \
              xcrun simctl launch "$UDID" com.rawleystanhope.rlmadk
            sleep 8
            xcrun simctl io "$UDID" screenshot "simulator-$(echo $view | tr 'A-Z_' 'a-z-').png"
          done
          for tab in work diagnostics; do
            xcrun simctl terminate "$UDID" com.rawleystanhope.rlmadk || true
            SIMCTL_CHILD_RLMADK_BACKEND_URL=http://127.0.0.1:8765 SIMCTL_CHILD_RLMADK_TALK_URL=http://127.0.0.1:7860 SIMCTL_CHILD_RLMADK_START_TAB=$tab SIMCTL_CHILD_RLMADK_SKIP_PERMISSION_PROMPTS=1 \
              xcrun simctl launch "$UDID" com.rawleystanhope.rlmadk
            sleep 6
            xcrun simctl io "$UDID" screenshot "simulator-$tab.png"
          done
          # Remote inspection through the backend: the app (still running, Diagnostics tab) must
          # report each command itself; the script fails if a command is not applied/failed as expected.
          python3 scripts/ci_remote_inspection.py http://127.0.0.1:8765 "$CONTAINER/Documents/captures/ambient-ci-seed/00000000.wav" ambient-ci-seed .
          sleep 2
          xcrun simctl io "$UDID" screenshot simulator-after-remote-select-tab.png
          python3 -m json.tool remote-inspection.json | head -80
          cd backend && ./run-backend logs 40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: |
            simulator.png
            simulator-reading.png
            simulator-navigator.png
            simulator-read-mode.png
            simulator-after-turn.png
            simulator-work.png
            simulator-diagnostics.png
            simulator-after-remote-select-tab.png
            simulator-remote-image.jpg
            remote-inspection.json
            fake-talk-log.json
            xcodebuild-build.log
            xcodebuild-test.log
            build/Build/Products/Debug-iphonesimulator/RLMADK.app/Info.plist
